<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rap Beats 监控台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #0d1117; color: #e6edf3; padding: 24px; line-height: 1.5;
  }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .badge { padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .badge.ok { background: #1f6f3f33; color: #3fb950; border: 1px solid #238636; }
  .badge.bad { background: #da363333; color: #f85149; border: 1px solid #f85149; }
  .muted { color: #8b949e; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; }
  .card h3 { font-size: 13px; color: #8b949e; font-weight: 500; margin-bottom: 10px; }
  .target { border-left: 4px solid #30363d; }
  .target.ok { border-left-color: #3fb950; }
  .target.degraded { border-left-color: #d29922; }
  .target.down { border-left-color: #f85149; }
  .target.unknown { border-left-color: #8b949e; }
  .t-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: #3fb950; box-shadow: 0 0 8px #3fb95088; }
  .dot.degraded { background: #d29922; box-shadow: 0 0 8px #d2992288; }
  .dot.down { background: #f85149; box-shadow: 0 0 8px #f8514988; animation: pulse 1.2s infinite; }
  .dot.unknown { background: #8b949e; }
  @keyframes pulse { 50% { opacity: .4; } }
  .t-meta { font-size: 12px; color: #8b949e; margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .t-err { color: #f85149; font-size: 12px; margin-top: 6px; word-break: break-all; }
  .section-title { font-size: 14px; font-weight: 600; color: #c9d1d9; margin: 18px 0 10px; }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
  .panel-head { padding: 12px 16px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .panel-head h2 { font-size: 15px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 500; background: #0d1117; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .log-line { padding: 6px 16px; border-bottom: 1px solid #21262d; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; }
  .log-line .src { color: #79c0ff; margin-right: 8px; }
  .log-line .time { color: #8b949e; margin-right: 8px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .filters button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .empty { padding: 20px; color: #8b949e; text-align: center; font-size: 13px; }
  .incident { display: flex; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #21262d; font-size: 13px; }
  .incident .kind { font-weight: 600; min-width: 70px; }
  .incident .kind.down { color: #f85149; }
  .incident .kind.recovered { color: #3fb950; }
  footer { color: #8b949e; font-size: 12px; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1>🖥️ Rap Beats 监控台</h1>
  <div style="display:flex;align-items:center;gap:12px">
    <span id="overall" class="badge unknown">…</span>
    <span id="clock" class="muted"></span>
  </div>
</header>

<div id="targets" class="grid"></div>

<div id="prodWrap">
  <div class="section-title">🏭 生产部署（SSH 容器健康）</div>
  <div class="panel"><div id="prod"></div></div>
</div>

<div class="section-title">📜 报错日志</div>
<div class="panel">
  <div class="panel-head">
    <h2>错误日志流</h2>
    <div id="logFilters" class="filters"></div>
  </div>
  <div id="logs"></div>
</div>

<div class="section-title">⏱️ 事件时间线</div>
<div class="panel" id="incidents"></div>

<footer>监控服务自 <span id="started"></span> 运行 · 每 5s 自动刷新 · 端口 4000</footer>

<script>
const $ = (s) => document.querySelector(s);
let logSourceFilter = 'all';
let data = null;

function fmtAgo(ts) {
  if (!ts) return '—';
  const d = Date.now() - ts;
  if (d < 0) return '刚刚';
  const s = Math.floor(d / 1000);
  if (s < 60) return s + 's 前';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm 前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h 前';
  return Math.floor(h / 24) + 'd 前';
}
function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString('zh-CN', { hour12: false }) : ''; }

function renderTargets() {
  const groups = {};
  for (const t of data.targets) (groups[t.group] ||= []).push(t);
  const el = $('#targets');
  el.innerHTML = '';
  for (const [g, list] of Object.entries(groups)) {
    for (const t of list) {
      const uptime = t.uptimePct == null ? '—' : t.uptimePct + '%';
      const card = document.createElement('div');
      card.className = 'card target ' + t.status;
      card.innerHTML = `
        <div class="t-name"><span class="dot ${t.status}"></span>${t.name}</div>
        <div class="t-meta">
          <span>状态: <b>${t.status}</b></span>
          <span>延迟: ${t.ms == null ? '—' : t.ms + ' ms'}</span>
          <span>在线率: ${uptime}</span>
          <span>最近检查: ${fmtAgo(t.lastCheckAt)}</span>
        </div>
        ${t.error ? `<div class="t-err">⚠ ${t.error}</div>` : ''}
      `;
      el.appendChild(card);
    }
  }
}

function renderProd() {
  const p = data.production;
  const wrap = $('#prodWrap');
  if (!p.enabled) { if (wrap) wrap.style.display = 'none'; return; }
  if (wrap) wrap.style.display = '';
  const el = $('#prod');
  if (p.sshError) {
    el.innerHTML = `<div class="empty" style="color:#f85149">SSH 连接失败: ${p.sshError}</div>`;
    return;
  }
  if (!p.containers.length) { el.innerHTML = '<div class="empty">暂无容器数据</div>'; return; }
  let rows = '';
  for (const c of p.containers) {
    rows += `<tr><td><span class="dot ${c.status}"></span> ${c.name}</td>
      <td>${c.status}</td><td class="muted">${c.statusText || ''}</td></tr>`;
  }
  el.innerHTML = `<table><thead><tr><th>容器</th><th>状态</th><th>详情</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderLogFilters() {
  const el = $('#logFilters');
  const sources = data.logSources || [];
  const all = { id: 'all', name: '全部' };
  const list = [all, ...sources];
  el.innerHTML = '';
  for (const s of list) {
    const b = document.createElement('button');
    b.textContent = s.name + (s.count != null ? ` (${s.count})` : '');
    b.className = logSourceFilter === s.id ? 'active' : '';
    b.onclick = () => { logSourceFilter = s.id; renderLogs(); renderLogFilters(); };
    el.appendChild(b);
  }
}

function renderLogs() {
  const el = $('#logs');
  let entries = data.logEntries || [];
  if (logSourceFilter !== 'all') entries = entries.filter(e => e.source === logSourceFilter);
  if (!entries.length) { el.innerHTML = '<div class="empty">暂无匹配的错误日志</div>'; return; }
  el.innerHTML = entries.slice(0, 200).map(e =>
    `<div class="log-line mono"><span class="src">[${e.sourceName}]</span><span class="time">${fmtTime(e.t)}</span>${escapeHtml(e.line)}</div>`
  ).join('');
}

function renderIncidents() {
  const el = $('#incidents');
  if (!data.incidents.length) { el.innerHTML = '<div class="empty">暂无事件</div>'; return; }
  el.innerHTML = data.incidents.slice(0, 30).map(i =>
    `<div class="incident"><span class="kind ${i.kind}">${i.kind === 'down' ? '▼ 故障' : '▲ 恢复'}</span>
     <span><b>${i.targetName}</b> <span class="muted">${i.from} → ${i.to}</span>
     ${i.message ? ` · <span class="t-err">${escapeHtml(i.message)}</span>` : ''}</span>
     <span class="muted" style="margin-left:auto">${fmtTime(i.at)}</span></div>`
  ).join('');
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render() {
  if (!data) return;
  const ok = data.summary.allOk;
  const badge = $('#overall');
  badge.className = 'badge ' + (ok ? 'ok' : 'bad');
  badge.textContent = ok ? '✓ 全部正常' : '⚠ ' + data.summary.downCount + ' 项异常';
  $('#clock').textContent = '更新于 ' + fmtTime(data.now);
  $('#started').textContent = data.monitor ? fmtAgo(data.monitor.startedAt) : '—';
  renderTargets();
  renderProd();
  renderLogs();
  renderIncidents();
}

async function refresh() {
  try {
    const res = await fetch('/api/overview', { cache: 'no-store' });
    data = await res.json();
    render();
    renderLogFilters();
  } catch (e) { $('#overall').textContent = '监控台离线'; }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
