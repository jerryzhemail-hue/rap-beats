services:
  # ============================================================
  # MySQL 数据库
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: rap-beats-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-rap_beats}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rap-beats-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # BPM Sidecar — Python + librosa v5
  # Handles accurate BPM/key detection for rap beats.
  # Falls back to JS detector in server if this container is unavailable.
  # ============================================================
  bpm:
    build:
      context: .
      dockerfile: Dockerfile.bpm
    container_name: rap-beats-bpm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rap-beats-net

  # ============================================================
  # 后端 API 服务
  # ============================================================
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: rap-beats-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 数据库连接：使用 MySQL（项目目前唯一支持的数据库）
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      DB_NAME: ${DB_NAME:-rap_beats}
      FORUM_DB_NAME: ${FORUM_DB_NAME:-rap_beats_forum}
      # BPM Sidecar — librosa v5
      BPM_SIDECAR_URL: http://rap-beats-bpm:5050
      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # 虎皮椒支付
      XUNHU_APPID: ${XUNHU_APPID}
      XUNHU_APPSECRET: ${XUNHU_APPSECRET}
      XUNHU_GATEWAY: ${XUNHU_GATEWAY:-https://api.xunhupay.com/payment/do.html}
      # 域名
      BASE_URL: ${BASE_URL:-http://localhost}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      # OSS 存储
      STORAGE_DRIVER: ${STORAGE_DRIVER:-oss}
      OSS_REGION: ${OSS_REGION}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL}
      OSS_AUDIO_PREFIX: ${OSS_AUDIO_PREFIX:-audio}
      OSS_COVER_PREFIX: ${OSS_COVER_PREFIX:-covers}
      OSS_AVATAR_PREFIX: ${OSS_AVATAR_PREFIX:-avatars}
    depends_on:
      mysql:
        condition: service_healthy
      bpm:
        condition: service_healthy
    networks:
      - rap-beats-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # 前端静态服务（Nginx）
  # ============================================================
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: rap-beats-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - rap-beats-net

# ============================================================
# 网络
# ============================================================
networks:
  rap-beats-net:
    driver: bridge

# ============================================================
# 持久化卷
# ============================================================
volumes:
  mysql_data:
