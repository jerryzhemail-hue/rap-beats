# ============================================================
# 项目名独立（避免与测试环境 compose 的服务名冲突）
name: rap-beats-dev

# ============================================================
# 本地开发环境 Docker Compose 配置（唯一 dev 数据库）
#
# 这是本地开发唯一使用的 MySQL，端口 3307，与线上 3306 彻底隔离。
# 不要再引入 Homebrew 3306 作为 dev 库。
#
# 启动：./start-dev.sh
# 停止：./start-dev.sh stop --all   （或 docker compose -f docker-compose.dev.yml down）
# 清理数据：docker compose -f docker-compose.dev.yml down -v
#
# 注意：本地开发时，后端 .env 需要配置 DB_HOST=127.0.0.1、DB_PORT=3307、
#       DB_USER=dev_user、DB_PASSWORD=dev_pass_2024（与下方一致）。
#       首次启动会自动创建主库 rap_beats_dev、论坛库 rap_beats_forum
#       和会员库 rap_beats_membership（由 docker/mysql-dev-init 提供）。
# ============================================================
services:
  # ============================================================
  # 本地 MySQL 数据库（开发专用）
  # 数据库名：rap_beats_dev + rap_beats_forum + rap_beats_membership
  # 端口：3307（唯一 dev 库，与线上 3306 隔离）
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: rap-beats-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dev_root_2024
      MYSQL_DATABASE: rap_beats_dev
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_pass_2024
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - rap-beats-dev-mysql-data:/var/lib/mysql
      # 首次启动自动创建论坛库（数据目录为空时才执行）
      - ./docker/mysql-dev-init:/docker-entrypoint-initdb.d:ro
    networks:
      - rap-beats-dev-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ============================================================
# 网络
# ============================================================
networks:
  rap-beats-dev-net:
    driver: bridge

# ============================================================
# 持久化卷
# ============================================================
volumes:
  rap-beats-dev-mysql-data:
