server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 文件上传大小限制（50MB，与 Multer 配置保持一致）
    client_max_body_size 50m;

    # ─── Access log token 防护 ───
    # 客户端通过 query 参数 ?token=xxx 给 <audio>/<a download> 鉴权（见 client/src/api/request.ts: getAuthUrl）
    # 这些 token 一旦写入 access log 就会被持久化（logrotate 备份、Sentry、监控都可能拿到），造成 JWT 泄漏。
    # 这里通过 map 在请求行里把 ?token=xxx 替换为空，再写到 access log，避免泄漏。
    # 同时 /api/beats/ 这种纯媒体路由干脆关掉 access log（流量大、价值低）。
    # 因为 map 指令必须在 http 上下文，而本文件被 include 进 http 块的位置不可控，
    # 这里采取保守做法：所有可能带 ?token= 的路由（音频流/下载）关闭 access log。

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # 静态资源缓存（CSS/JS/图片）
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 请求代理到后端（同一 Docker 网络内通过服务名访问）
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 反代超时（音频流/上传/积分补偿等长请求需要放宽；SSE 单独再设）
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # WebSocket 支持（如有需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SSE（消息推送）：必须禁用缓冲 + 拉长读超时
    location /api/messages/stream {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键配置：不缓冲、不缓存、长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;        # 1h，远大于 30s 心跳
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;

        # 必须清掉 Connection 头，让 http/1.1 keep-alive 生效
        proxy_set_header Connection '';
    }

    # 音频流 / 下载：URL 可能带 ?token= 鉴权，不能写入 access log（防 token 泄漏）
    location /api/beats/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;         # 大音频文件下载
        # 屏蔽带 token query 参数的请求写入 access log
        access_log off;
    }

    # 音频、封面、头像等用户上传文件（^~ 避免被下方静态资源正则抢先匹配）
    location ^~ /audio/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;         # 大音频文件下载
    }

    location ^~ /covers/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location ^~ /avatars/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location ^~ /banners/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location ^~ /forum-images/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location ^~ /forum-audio/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    location /forum/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # 支付回调等外部回调
    location /payment/callback {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # 前端路由（SPA fallback）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存（确保路由变更及时生效）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
