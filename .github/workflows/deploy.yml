name: Build & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/rap-beats-server:latest
  CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/rap-beats-client:latest
  SERVER_IMAGE_SHA: ghcr.io/${{ github.repository_owner }}/rap-beats-server:${{ github.sha }}
  CLIENT_IMAGE_SHA: ghcr.io/${{ github.repository_owner }}/rap-beats-client:${{ github.sha }}

jobs:
  test:
    name: Backend Tests (vitest 全量)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_2024
          MYSQL_USER: dev_user
          MYSQL_PASSWORD: dev_pass_2024
          MYSQL_CHARSET: utf8mb4
          MYSQL_COLLATION: utf8mb4_unicode_ci
          TZ: Asia/Shanghai
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server deps
        working-directory: server
        run: npm ci || npm install
      - name: Create test databases & grant
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -pci_root_2024 --silent 2>/dev/null; then
              echo "MySQL ready"; break
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -P 3307 -uroot -pci_root_2024 <<'SQL'
            CREATE DATABASE IF NOT EXISTS rap_beats_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS rap_beats_forum_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS rap_beats_membership_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON rap_beats_test.* TO 'dev_user'@'%';
            GRANT ALL PRIVILEGES ON rap_beats_forum_test.* TO 'dev_user'@'%';
            GRANT ALL PRIVILEGES ON rap_beats_membership_test.* TO 'dev_user'@'%';
            FLUSH PRIVILEGES;
          SQL
      - name: Run vitest (全量测试)
        working-directory: server
        run: npm test

  build:
    name: Build Docker Images
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Extract metadata (client)
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CLIENT_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # ---------- Build server ----------
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}
            ${{ env.SERVER_IMAGE_SHA }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      # ---------- Build client ----------
      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}
            ${{ env.CLIENT_IMAGE_SHA }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Image digest (server)
        run: 'echo "Server image: ${{ env.SERVER_IMAGE_SHA }}"'

      - name: Image digest (client)
        run: 'echo "Client image: ${{ env.CLIENT_IMAGE_SHA }}"'

  deploy:
    name: Deploy to Server
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host known: ${{ vars.SERVER_HOST }}"

      - name: Backup database before deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }} '
            set -e
            mkdir -p ${{ vars.SERVER_DEPLOY_DIR }}/backups
            if docker ps --format "{{.Names}}" | grep -q "^rap-beats-mysql$"; then
              set -a
              . ${{ vars.SERVER_DEPLOY_DIR }}/.env 2>/dev/null || true
              set +a
              docker exec rap-beats-mysql sh -c "exec mysqldump -uroot -p\"\$MYSQL_ROOT_PASSWORD\" --single-transaction --databases ${{ vars.DB_NAME }} ${{ vars.FORUM_DB_NAME }}" > ${{ vars.SERVER_DEPLOY_DIR }}/backups/predeploy-$(date +%F-%H%M%S).sql 2>/dev/null \
                && echo "数据库备份完成" \
                || echo "数据库备份失败（继续部署，请手动检查）"
            else
              echo "MySQL 容器未运行，跳过备份"
            fi
          '

      - name: Copy deployment files to server
        run: |
          rsync -az \
            --include='docker-compose.prod.yml' \
            --include='nginx.client.conf' \
            --include='Dockerfile.client' \
            --include='Dockerfile.server' \
            --exclude='._*' \
            --exclude='.git' \
            --exclude='*' \
            -e "ssh -o StrictHostKeyChecking=no" \
            . ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}:${{ vars.SERVER_DEPLOY_DIR }}

      - name: Pull images and restart containers
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }} "
            set -e
            cd ${{ vars.SERVER_DEPLOY_DIR }}

            # 导出镜像变量，供后续所有 docker compose 命令使用（down/up/ps 都会插值）
            export SERVER_IMAGE=ghcr.io/${{ github.repository_owner }}/rap-beats-server:${{ github.sha }}
            export CLIENT_IMAGE=ghcr.io/${{ github.repository_owner }}/rap-beats-client:${{ github.sha }}

            # 登录 ghcr.io（使用 GitHub Token）
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 拉取本次构建的镜像（按 commit SHA 固定版本）
            docker pull ghcr.io/${{ github.repository_owner }}/rap-beats-server:${{ github.sha }}
            docker pull ghcr.io/${{ github.repository_owner }}/rap-beats-client:${{ github.sha }}

            # 停止旧容器（数据卷保留）
            docker compose -f docker-compose.prod.yml down --remove-orphans || true

            # 清理历史上手动启动/无 compose 标签的遗留容器，避免容器名冲突导致 up 失败
            for c in rap-beats-server rap-beats-bpm rap-beats-client rap-beats-mysql; do
              if [ "$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' $c 2>/dev/null)" != "rap-beats" ]; then
                docker rm -f $c 2>/dev/null || true
              fi
            done

            # 启动新容器（compose 自动读取同目录 .env 中的配置变量）
            docker compose -f docker-compose.prod.yml up -d

            echo '等待服务启动...'
            sleep 10

            # 健康检查
            for i in \$(seq 1 15); do
              if docker exec rap-beats-server wget -q --spider http://localhost:3000/api/health 2>/dev/null; then
                echo '后端服务健康'
                break
              fi
              echo \"等待后端启动... (\$i/15)\"
              sleep 3
            done

            docker compose -f docker-compose.prod.yml ps
            echo '部署完成！'
          "

      - name: Cleanup old images on server
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }} "
            docker image prune -af --filter 'until=120h' || true
            echo '镜像清理完成'
          "
