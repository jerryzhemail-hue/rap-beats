name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_mysql_init:
        description: '跳过 MySQL 初始化（仅重启服务）'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/rap-beats-server:latest
  CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/rap-beats-client:latest
  SERVER_IMAGE_SHA: ghcr.io/${{ github.repository_owner }}/rap-beats-server:${{ github.sha }}
  CLIENT_IMAGE_SHA: ghcr.io/${{ github.repository_owner }}/rap-beats-client:${{ github.sha }}

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Extract metadata (client)
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CLIENT_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # ---------- Build server ----------
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}
            ${{ env.SERVER_IMAGE_SHA }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      # ---------- Build client ----------
      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}
            ${{ env.CLIENT_IMAGE_SHA }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Image digest (server)
        run: echo "Server image: ${{ env.SERVER_IMAGE_SHA }}"

      - name: Image digest (client)
        run: echo "Client image: ${{ env.CLIENT_IMAGE_SHA }}"

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download docker-compose.prod.yml
        run: |
          cat > docker-compose.prod.yml << 'EOF'
          version: '3.9'

          services:
            mysql:
              image: mysql:8.0
              container_name: rap-beats-mysql
              restart: unless-stopped
              environment:
                MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
                MYSQL_DATABASE: ${DB_NAME:-rap_beats}
                MYSQL_CHARSET: utf8mb4
                MYSQL_COLLATION: utf8mb4_unicode_ci
                TZ: Asia/Shanghai
              ports:
                - "3306:3306"
              volumes:
                - mysql_data:/var/lib/mysql
              networks:
                - rap-beats-net
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 30s

            server:
              image: ghcr.io/${{ github.repository_owner }}/rap-beats-server:${{ github.sha }}
              container_name: rap-beats-server
              restart: unless-stopped
              ports:
                - "3000:3000"
              environment:
                DB_DRIVER: mysql
                DB_HOST: mysql
                DB_PORT: 3306
                DB_USER: root
                DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
                DB_NAME: ${DB_NAME:-rap_beats}
                FORUM_DB_NAME: ${FORUM_DB_NAME:-rap_beats_forum}
                JWT_SECRET: ${JWT_SECRET}
                XUNHU_APPID: ${XUNHU_APPID}
                XUNHU_APPSECRET: ${XUNHU_APPSECRET}
                XUNHU_GATEWAY: ${XUNHU_GATEWAY:-https://api.xunhupay.com/payment/do.html}
                BASE_URL: ${BASE_URL}
                CLIENT_URL: ${CLIENT_URL}
                STORAGE_DRIVER: ${STORAGE_DRIVER:-oss}
                OSS_REGION: ${OSS_REGION}
                OSS_BUCKET: ${OSS_BUCKET}
                OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
                OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
                OSS_ENDPOINT: ${OSS_ENDPOINT}
                OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL}
                OSS_AUDIO_PREFIX: ${OSS_AUDIO_PREFIX:-audio}
                OSS_COVER_PREFIX: ${OSS_COVER_PREFIX:-covers}
                OSS_AVATAR_PREFIX: ${OSS_AVATAR_PREFIX:-avatars}
              depends_on:
                mysql:
                  condition: service_healthy
              networks:
                - rap-beats-net
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 15s

            client:
              image: ghcr.io/${{ github.repository_owner }}/rap-beats-client:${{ github.sha }}
              container_name: rap-beats-client
              restart: unless-stopped
              ports:
                - "80:80"
              depends_on:
                - server
              networks:
                - rap-beats-net

          networks:
            rap-beats-net:
              driver: bridge

          volumes:
            mysql_data:
          EOF

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host known: ${{ vars.SERVER_HOST }}"

      - name: Copy deployment files to server
        run: |
          echo "同步以下文件到服务器..."
          rsync -az --delete \
            --include='docker-compose.prod.yml' \
            --include='nginx.client.conf' \
            --include='Dockerfile.client' \
            --include='Dockerfile.server' \
            --exclude='*' \
            -e "ssh -o StrictHostKeyChecking=no" \
            . ${{ secrets.SERVER_USER }}@${{ vars.SERVER_HOST }}:${{ vars.SERVER_DEPLOY_DIR }}

      - name: Build client image on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ vars.SERVER_HOST }} "
            set -e
            cd ${{ vars.SERVER_DEPLOY_DIR }}

            # 登录 ghcr.io（使用 GitHub Token）
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 拉取新镜像
            echo '拉取 server 镜像...'
            docker pull ghcr.io/${{ github.repository_owner }}/rap-beats-server:${{ github.sha }}

            echo '拉取 client 镜像...'
            docker pull ghcr.io/${{ github.repository_owner }}/rap-beats-client:${{ github.sha }}

            # 重新 tag 为 latest
            docker tag ghcr.io/${{ github.repository_owner }}/rap-beats-server:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/rap-beats-server:latest
            docker tag ghcr.io/${{ github.repository_owner }}/rap-beats-client:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/rap-beats-client:latest

            # 停止旧容器（保留数据卷）
            docker compose -f docker-compose.prod.yml down --remove-orphans || true

            # 启动新容器
            IMAGE_TAG_SHA=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d

            echo '等待服务启动...'
            sleep 10

            # 健康检查
            for i in \$(seq 1 15); do
              if docker exec rap-beats-server wget -q --spider http://localhost:3000/api/health 2>/dev/null; then
                echo '后端服务健康'
                break
              fi
              echo \"等待后端启动... (\$i/15)\"
              sleep 3
            done

            docker compose -f docker-compose.prod.yml ps
            echo '部署完成！'
          "

      - name: Cleanup old images on server
        if: always()
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ vars.SERVER_HOST }} "
            # 清理超过 5 天的旧镜像节省空间
            docker image prune -af --filter 'until=120h' || true
            echo '镜像清理完成'
          "
