name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests (Membership/VIP)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_2024
          MYSQL_DATABASE: rap_beats_dev
          MYSQL_USER: dev_user
          MYSQL_PASSWORD: dev_pass_2024
          MYSQL_CHARSET: utf8mb4
          MYSQL_COLLATION: utf8mb4_unicode_ci
          TZ: Asia/Shanghai
        ports:
          - 3307:3306
        volumes:
          - ./docker/mysql-dev-init:/docker-entrypoint-initdb.d:ro
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci || npm install

      - name: Wait for MySQL
        run: |
          echo "等待 MySQL 健康..."
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/3307) 2>/dev/null; then
              echo "MySQL 端口可达"
              break
            fi
            echo "  重试 $i/30..."
            sleep 2
          done
          # 额外 sleep 等 init scripts 跑完
          sleep 5

      - name: Create membership database & grant
        run: |
          mysql -h 127.0.0.1 -P 3307 -uroot -pci_root_2024 <<'SQL'
            CREATE DATABASE IF NOT EXISTS rap_beats_membership CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON rap_beats_membership.* TO 'dev_user'@'%';
            FLUSH PRIVILEGES;
          SQL

      - name: Create CI .env
        working-directory: server
        run: |
          cat > .env <<'EOF'
          DB_DRIVER=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3307
          DB_USER=dev_user
          DB_PASSWORD=dev_pass_2024
          DB_NAME=rap_beats_dev
          DB_POOL_SIZE=10

          FORUM_DB_NAME=rap_beats_forum
          MEMBERSHIP_DB_NAME=rap_beats_membership

          STORAGE_DRIVER=local
          MOCK_PAYMENT_ENABLED=true
          JWT_SECRET=ci-jwt-secret-do-not-use-in-prod-0123456789abcdef0123456789abcdef
          BASE_URL=http://localhost:3000
          CLIENT_URL=http://localhost:5173
          NODE_ENV=development
          RATE_LIMIT_ENABLED=false
          EOF

      - name: Seed forum data (creates testadmin + test users)
        working-directory: server
        env:
          DB_PASSWORD: dev_pass_2024
        run: |
          npx tsx src/scripts/create-test-users-full.ts
          echo "---"
          # 同时种论坛测试数据(让 test-forum-messages.ts 的 resolvePeer 能找到人)
          npx tsx src/scripts/seed-forum-data.ts

      - name: TypeScript type check
        working-directory: server
        run: npx tsc --noEmit

      - name: Start server (background)
        working-directory: server
        run: |
          nohup npm run dev > /tmp/server.log 2>&1 &
          echo "Server PID: $!"
          sleep 12
          # 健康检查
          for i in $(seq 1 15); do
            if curl -s http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              echo "Server healthy"
              break
            fi
            echo "等待后端... $i/15"
            sleep 3
          done
          curl -s http://localhost:3000/api/health
          echo

      - name: Run Membership/VIP tests
        working-directory: server
        run: npm run test-membership

      - name: Run Forum tests
        working-directory: server
        run: npm run test-forum

      - name: Server logs (on failure)
        if: failure()
        run: |
          echo "=== server.log ==="
          tail -100 /tmp/server.log

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci || npm install

      - name: TypeScript type check
        working-directory: client
        run: npx vue-tsc --noEmit

      - name: Build
        working-directory: client
        run: npm run build
