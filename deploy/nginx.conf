server {
    listen 80;
    server_name YOUR_DOMAIN;  # 替换为你的域名，如 beats.example.com

    root /var/www/rap-beats/client;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # 静态资源长期缓存（CSS/JS/图片）
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到 Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 本地存储模式下的媒体资源（OSS 模式走签名 URL，不经此处）
    location /audio/       { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; }
    location /covers/      { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; }
    location /avatars/     { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; }
    location /banners/     { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; }
    location /forum-images/{ proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; }
    location /forum-audio/ { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; }
    location /forum/       { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; }

    # 上传文件大小限制（最大 50MB）
    client_max_body_size 50m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存（确保路由变更及时生效）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# HTTPS 服务器块：域名解析好后运行
#   certbot --nginx -d YOUR_DOMAIN
# certbot 会自动生成并替换以下配置
